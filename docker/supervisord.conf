[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:surrealdb]
command=surreal start --log info --auth --user %(ENV_DB_USER)s --pass %(ENV_DB_PASS)s --bind 0.0.0.0:%(ENV_DB_PORT)s file:///data/db
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=SURREAL_INSECURE_FORWARD_SCOPE_INTERNAL_SERVER_ERRORS=true
priority=10

[program:migrations]
command=/app/docker/run-migrations.sh
directory=/app
autostart=true
autorestart=false
startsecs=0
exitcodes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=15

[program:nodejs]
command=sh -c "echo 'Waiting for migrations...' && sleep 30 && echo 'Starting Node.js app...' && npx primate serve"
directory=/app
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=20
environment=NODE_ENV="%(ENV_NODE_ENV)s",PORT="%(ENV_PORT)s",DB_USER="%(ENV_DB_USER)s",DB_PASS="%(ENV_DB_PASS)s",DB_PORT="%(ENV_DB_PORT)s",DB_HOST="%(ENV_DB_HOST)s",DB_NS="%(ENV_DB_NS)s",DB_DB="%(ENV_DB_DB)s"